name: Build & Auto-Release OpenRGB Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Plugin, Windows Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules and full history
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version, release tag, and commit changelog
        id: meta
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo        = "${{ github.repository }}"
          $commitCount = (git rev-list --count HEAD).Trim()
          $shortSha    = (git rev-parse --short=7 HEAD).Trim()
          $headSha     = (git rev-parse HEAD).Trim()
          $appVersion  = "1.0.$commitCount"
          $tagName     = "v$appVersion"

          # Append short SHA if a tag with this commit count already exists
          $existingTag = (git tag -l $tagName)
          if ($existingTag) {
            $tagName = "v$appVersion-$shortSha"
          }

          $prevTag = ""
          $prevTags = @(git tag -l "v*" --sort=-creatordate)
          foreach ($t in $prevTags) {
            $tagSha = (git rev-list -n 1 $t 2>$null).Trim()
            if ($tagSha -and ($tagSha -ne $headSha)) {
              $prevTag = $t.Trim()
              break
            }
          }

          if ($prevTag) {
            $commitShas = @(git log "$prevTag..HEAD" --no-merges --pretty=format:"%H")
            $changelogHeader = "### Changelog (since ``$prevTag``)"
            $compareFooter   = "**Full Changelog**: [``$prevTag...$tagName``](https://github.com/$repo/compare/$prevTag...$tagName)"
          } else {
            $commitShas = @(git log -n 30 --no-merges --pretty=format:"%H")
            $changelogHeader = "### Changelog"
            $compareFooter   = "**Commits**: [``$tagName``](https://github.com/$repo/commits/$tagName)"
          }

          $apiHeaders = @{
            "User-Agent"    = "OpenRGB-Audio-Plugin-Release"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
          }
          $loginCache = @{}
          $commits = @()

          foreach ($cSha in $commitShas) {
            $fullSha = "$cSha".Trim()
            if (-not $fullSha) { continue }
            $cShort      = $fullSha.Substring(0, 7)
            $subject     = (git log -n 1 $fullSha --pretty=format:"%s").Trim()
            $authorName  = (git log -n 1 $fullSha --pretty=format:"%an").Trim()
            $authorEmail = (git log -n 1 $fullSha --pretty=format:"%ae").Trim()

            $ghLogin = ""
            if ($authorEmail -and $loginCache.ContainsKey($authorEmail)) {
              $ghLogin = $loginCache[$authorEmail]
            } else {
              try {
                $cApi = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/commits/$fullSha" -Headers $apiHeaders
                if ($cApi.author -and $cApi.author.login) {
                  $ghLogin = $cApi.author.login
                } elseif ($cApi.committer -and $cApi.committer.login -and $cApi.committer.login -ne "web-flow") {
                  $ghLogin = $cApi.committer.login
                }
              } catch {}

              if (-not $ghLogin -and $authorEmail -match '^(?:\d+\+)?([^@]+)@users\.noreply\.github\.com$') {
                $ghLogin = $Matches[1]
              }
              if ($ghLogin -and $authorEmail) {
                $loginCache[$authorEmail] = $ghLogin
              }
            }

            $commitLink = "[``$cShort``](https://github.com/$repo/commit/$fullSha)"
            if ($ghLogin) {
              $authorLink = "[@$ghLogin](https://github.com/$ghLogin)"
            } else {
              $authorLink = $authorName
            }
            $commits += "- $subject ($commitLink by $authorLink)"
          }

          if (-not $commits -or $commits.Count -eq 0) {
            $actor = "${{ github.actor }}"
            $commits = @("- Automated build for commit [``$shortSha``](https://github.com/$repo/commit/$headSha) by [@$actor](https://github.com/$actor)")
          }

          $zipName   = "OpenRGBAudioRefreshPlugin-v$appVersion-Windows-x64.zip"
          $setupName = "OpenRGBAudioRefreshPlugin-v$appVersion-Windows-x64-Setup.exe"

          $notes = @(
            "## OpenRGB Audio Refresh & Priority Plugin ``v$appVersion``"
            ""
            "| Target Host | OpenRGB Plugin API | Qt / Toolchain | Platform |"
            "| :--- | :--- | :--- | :--- |"
            "| OpenRGB ``0.9+`` / ``1.0rc1``-``1.0rc3`` | **API Version 4** | Qt ``5.15.0`` MSVC x64 | Windows 64-bit (confirmed working) |"
            ""
            "### Installation Options"
            "1. **One-Click Windows Setup Installer (``$setupName``):** Run the installer to deploy ``OpenRGBAudioRefreshPlugin.dll`` to ``%APPDATA%\OpenRGB\plugins`` (no UAC elevation required; supports hot-staging while OpenRGB is running)."
            "2. **OpenRGB Built-In Plugin Installer (``OpenRGBAudioRefreshPlugin.dll``):** Download ``OpenRGBAudioRefreshPlugin.dll`` and select it via **OpenRGB -> Settings -> Plugins -> Install Plugin** (or drag and drop it onto the Plugins list)."
            "3. **Portable ZIP Bundle (``$zipName``):** Extract ``OpenRGBAudioRefreshPlugin.dll`` into ``%APPDATA%\OpenRGB\plugins\`` and restart OpenRGB."
            ""
            $changelogHeader
            ($commits -join "`n")
            ""
            $compareFooter
          ) -join "`n"

          Set-Content -Path "$env:RUNNER_TEMP\RELEASE_NOTES.md" -Value $notes -Encoding utf8

          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short_sha=$shortSha"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag_name=$tagName"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prev_tag=$prevTag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=$zipName"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup_name=$setupName"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Qt 5.15.0 (win64_msvc2019_64 qtbase)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          archives: 'qtbase'
          cache: true
          cache-key-prefix: 'qt5150-msvc2019-x64-qtbase'

      - name: Initialize MSVC x64 Developer Environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -products * -latest -prerelease -property installationPath).Trim()
          if (-not $vsPath) {
            throw "Could not locate Visual Studio installation via vswhere.exe"
          }
          Write-Host "Found Visual Studio at: $vsPath"
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-ChildItem Env: | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Compile OpenRGBAudioRefreshPlugin.dll & Verify QTMETADATA
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ steps.meta.outputs.app_version }}
          PLUGIN_COMMIT: ${{ steps.meta.outputs.short_sha }}
        run: |
          cmd.exe /c ".\build.bat"
          if ($LASTEXITCODE -ne 0) {
            throw "build.bat failed with exit code $LASTEXITCODE"
          }
          $dllPath = "build\OpenRGBAudioRefreshPlugin.dll"
          if (-not (Test-Path $dllPath)) {
            throw "Compiled DLL not found at $dllPath"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dllPath))
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch "QTMETADATA" -or $ascii -notmatch "com\.OpenRGBPluginInterface") {
            throw "QTMETADATA or com.OpenRGBPluginInterface IID missing from compiled DLL!"
          }
          Write-Host "Verified QTMETADATA and com.OpenRGBPluginInterface in $dllPath ($($bytes.Length) bytes)"

      - name: Package Release Artifacts (DLL, Portable ZIP, Inno Setup Installer, SHA256SUMS)
        shell: pwsh
        run: |
          $distDir = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # 1. Canonical unversioned DLL for OpenRGB's built-in "Install Plugin" button
          Copy-Item -Force "build\OpenRGBAudioRefreshPlugin.dll" "$distDir\OpenRGBAudioRefreshPlugin.dll"

          # 2. Portable ZIP bundle
          $stageZip = Join-Path $env:RUNNER_TEMP "zip_stage"
          New-Item -ItemType Directory -Force -Path $stageZip | Out-Null
          Copy-Item -Force "build\OpenRGBAudioRefreshPlugin.dll" "$stageZip\OpenRGBAudioRefreshPlugin.dll"
          Copy-Item -Force "README.md" "$stageZip\README.md"
          Copy-Item -Force "LICENSE.txt" "$stageZip\LICENSE.txt"
          $zipPath = Join-Path $distDir "${{ steps.meta.outputs.zip_name }}"
          Compress-Archive -Path "$stageZip\*" -DestinationPath $zipPath -Force

          # 3. Windows Setup .exe Installer via pre-installed Inno Setup 6 (ISCC.exe)
          iscc.exe /Qp `
            "/DMyAppVersion=${{ steps.meta.outputs.app_version }}" `
            "/DSourceDir=$PWD\dist" `
            "/O$distDir" `
            "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          # 4. Generate SHA256SUMS.txt
          $checksumLines = @()
          Get-ChildItem -Path $distDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLines += "$hash  $($_.Name)"
          }
          Set-Content -Path "$distDir\SHA256SUMS.txt" -Value ($checksumLines -join "`n") -Encoding utf8
          Write-Host "=== Packaged Release Files ==="
          Get-ChildItem -Path $distDir | Select-Object Name, Length | Format-Table -AutoSize
          Get-Content "$distDir\SHA256SUMS.txt"

      - name: Publish Automatic GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "OpenRGB Audio Refresh & Priority Plugin v${{ steps.meta.outputs.app_version }} (${{ steps.meta.outputs.short_sha }})"
          body_path: ${{ runner.temp }}\RELEASE_NOTES.md
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            dist/OpenRGBAudioRefreshPlugin.dll
            dist/${{ steps.meta.outputs.setup_name }}
            dist/${{ steps.meta.outputs.zip_name }}
            dist/SHA256SUMS.txt
